%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,sm7250-venus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM7250 Venus video encode and decode accelerators

maintainers:
  - Sreeshankar K <sreeshankar0910@gmail.com>

description: |
  The Venus IP is a video encode and decode accelerator present
  on Qualcomm platforms

allOf:
  - $ref: qcom,venus-common.yaml#

properties:
  compatible:
    const: qcom,sm7250-venus

  power-domains:
    minItems: 2
    maxItems: 3

  power-domain-names:
    minItems: 2
    items:
      - const: venus
      - const: vcodec0
      - const: cx

  clocks:
    maxItems: 5

  clock-names:
    items:
      - const: core
      - const: iface
      - const: bus
      - const: vcodec0_core
      - const: vcodec0_bus

  iommus:
    maxItems: 2

  memory-region:
    maxItems: 1

  interconnects:
    maxItems: 2

  interconnect-names:
    items:
      - const: video-mem
      - const: cpu-cfg

  operating-points-v2: true
  opp-table:
    type: object

  video-decoder:
    type: object

    properties:
      compatible:
        const: venus-decoder

    required:
      - compatible

    deprecated: true
    additionalProperties: false

  video-encoder:
    type: object

    properties:
      compatible:
        const: venus-encoder

    required:
      - compatible

    deprecated: true
    additionalProperties: false

  video-firmware:
    type: object
    additionalProperties: false

    description: |
      Firmware subnode is needed when the platform does not
      have TrustZone.

    properties:
      iommus:
        maxItems: 1

    required:
      - iommus

required:
  - compatible
  - power-domain-names
  - iommus

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/qcom,sm7250-videocc.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>

    video-codec@aa00000 {
        compatible = "qcom,sm7250-venus";
        reg = <0x0aa00000 0xff000>;
        interrupts = <GIC_SPI 174 IRQ_TYPE_LEVEL_HIGH>;
        power-domains = <&videocc MVSC_GDSC>,
                        <&videocc MVS0_GDSC>,
                        <&rpmhpd RPMHPD_CX>;
        power-domain-names = "venus", "vcodec0", "cx";
        operating-points-v2 = <&venus_opp_table>;
        clocks = <&videocc VIDEOCC_MVSC_CORE_CLK>,
                 <&videocc VIDEOCC_VENUS_AHB_CLK>,
                 <&videocc VIDEOCC_MVSC_CTL_AXI_CLK>,
                 <&videocc VIDEOCC_MVS0_CORE_CLK>,
                 <&videocc VIDEOCC_MVS0_AXI_CLK>;
        clock-names = "core", "iface", "bus",
                      "vcodec0_core", "vcodec0_bus";
        iommus = <&apps_smmu 0x1380 0x60>,
                 <&apps_smmu 0x1360 0x0>;
        memory-region = <&video_mem>;

        venus_opp_table: opp-table {
            compatible = "operating-points-v2";

            opp-240000000 {
                opp-hz = /bits/ 64 <240000000>;
                required-opps = <&rpmhpd_opp_low_svs>;
            };
        };
    };
