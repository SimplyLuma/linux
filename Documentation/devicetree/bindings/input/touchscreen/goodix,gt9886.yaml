%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/goodix,gt9886.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Goodix GT9886 touchscreen controller

maintainers:
  - lazybrar <211365301+lazybrar@users.noreply.github.com>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: goodix,gt9886

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Analog supply (2.8 V)

  vddio-supply:
    description: I/O supply (1.8 V)

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - vddio-supply
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@5d {
            compatible = "goodix,gt9886";
            reg = <0x5d>;
            interrupt-parent = <&tlmm>;
            interrupts = <9 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 8 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l13a>;
            vddio-supply = <&vreg_l1c>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2400>;
        };
    };
...
