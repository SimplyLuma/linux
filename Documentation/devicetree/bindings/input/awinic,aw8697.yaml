%YAML 1.2
---
$id: http://devicetree.org/schemas/input/awinic,aw8697.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW8697 haptic driver for LRA motors

maintainers:
  - lazybrar <211365301+lazybrar@users.noreply.github.com>

properties:
  compatible:
    const: awinic,aw8697

  reg:
    maxItems: 1

  reset-gpios:
    description: Active-low reset (RSTN) pin
    maxItems: 1

  interrupts:
    description: Interrupt line (INTN), currently not used by the driver
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        haptics@5a {
            compatible = "awinic,aw8697";
            reg = <0x5a>;
            reset-gpios = <&tlmm 71 GPIO_ACTIVE_LOW>;
            interrupts-extended = <&tlmm 70 IRQ_TYPE_LEVEL_LOW>;
        };
    };
