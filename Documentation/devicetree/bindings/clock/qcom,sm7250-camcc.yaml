%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm7250-camcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Camera Clock & Reset Controller on SM7250

maintainers:
  - lazybrar <211365301+lazybrar@users.noreply.github.com>

description: |
  Qualcomm camera clock control module provides the clocks and power
  domains on SM7250.

  See also: include/dt-bindings/clock/qcom,camcc-sm7250.h

allOf:
  - $ref: qcom,gcc.yaml#

properties:
  compatible:
    const: qcom,sm7250-camcc

  clocks:
    items:
      - description: AHB
      - description: Board XO source
      - description: Board active XO source
      - description: Sleep clock source

  clock-names:
    items:
      - const: iface
      - const: bi_tcxo
      - const: bi_tcxo_ao
      - const: sleep_clk

  power-domains:
    items:
      - description: CX power domain

  reg:
    maxItems: 1

  required-opps:
    maxItems: 1
    description:
      OPP node describing required CX performance point.

required:
  - compatible
  - clocks
  - clock-names
  - power-domains
  - required-opps

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/clock/qcom,sm7250-gcc.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>
    clock-controller@ad00000 {
      compatible = "qcom,sm7250-camcc";
      reg = <0x0ad00000 0x10000>;
      clocks = <&gcc GCC_CAMERA_AHB_CLK>,
               <&rpmhcc RPMH_CXO_CLK>,
               <&rpmhcc RPMH_CXO_CLK_A>,
               <&sleep_clk>;
      clock-names = "iface", "bi_tcxo", "bi_tcxo_ao", "sleep_clk";
      power-domains = <&rpmhpd RPMHPD_CX>;
      required-opps = <&rpmhpd_opp_low_svs>;
      #clock-cells = <1>;
      #power-domain-cells = <1>;
    };
...
